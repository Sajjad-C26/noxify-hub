<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noxify - Elite Sports Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js for direct .m3u8 live streaming support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #f3f4f6; }
        .glow-red { box-shadow: 0 0 25px rgba(239, 68, 68, 0.25); }
        .glow-border { border: 1px solid rgba(239, 68, 68, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28 max-w-md mx-auto relative min-h-screen selection:bg-red-600 selection:text-white">

    <!-- TOP HEADER -->
    <header class="flex items-center justify-between px-4 py-3 sticky top-0 bg-[#050505]/95 backdrop-blur-md z-50 border-b border-white/5">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse"></span>
            <h1 class="text-xl font-extrabold tracking-wider text-red-600 uppercase">NOXIFY</h1>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-gradient-to-r from-amber-500/20 to-yellow-500/20 text-amber-400 border border-amber-500/30">VIP ELITE</span>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-purple-600 flex items-center justify-center font-bold text-sm text-white shadow-md">S</div>
        </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="px-4 py-3">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-zinc-500 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search teams, matches, or sports..." class="w-full bg-[#121214] text-sm text-white pl-10 pr-4 py-3 rounded-xl glow-border focus:outline-none focus:border-red-600 transition">
        </div>
    </div>

    <!-- CONTENT CONTAINER -->
    <main id="mainContent" class="px-4 space-y-4">
        <!-- Loading State -->
        <div class="text-center py-20 text-zinc-500 text-xs">
            <i class="fa-solid fa-spinner animate-spin text-red-600 text-xl mb-2"></i>
            <p>Syncing Live Sports Data...</p>
        </div>
    </main>

    <!-- CINEMATIC STREAMING MODAL (IN-APP HLS PLAYER) -->
    <div id="streamModal" class="fixed inset-0 z-50 bg-black/95 flex flex-col hidden">
        <div class="flex items-center justify-between p-4 border-b border-zinc-800 bg-[#0a0a0c]">
            <div class="flex items-center space-x-2 truncate">
                <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
                <h3 id="modalTitle" class="font-bold text-red-500 text-sm truncate">Live HD Stream</h3>
            </div>
            <button onclick="closeStream()" class="w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center text-white hover:bg-zinc-800 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 relative flex items-center justify-center bg-black">
            <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0a0a0c]/95 backdrop-blur-lg border-t border-white/10 px-2 py-2.5 flex justify-around items-center z-40">
        <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center space-y-1 text-red-500" data-tab="home">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="switchTab('live')" class="nav-btn flex flex-col items-center space-y-1 text-zinc-500" data-tab="live">
            <i class="fa-solid fa-bolt text-lg"></i>
            <span class="text-[10px] font-semibold">Live Hub</span>
        </button>
        <button onclick="switchTab('schedule')" class="nav-btn flex flex-col items-center space-y-1 text-zinc-500" data-tab="schedule">
            <i class="fa-solid fa-calendar-days text-lg"></i>
            <span class="text-[10px] font-semibold">Schedule</span>
        </button>
        <button onclick="switchTab('favorites')" class="nav-btn flex flex-col items-center space-y-1 text-zinc-500" data-tab="favorites">
            <i class="fa-solid fa-heart text-lg"></i>
            <span class="text-[10px] font-semibold">Favorites</span>
        </button>
        <button onclick="switchTab('replays')" class="nav-btn flex flex-col items-center space-y-1 text-zinc-500" data-tab="replays">
            <i class="fa-solid fa-film text-lg"></i>
            <span class="text-[10px] font-semibold">Replays</span>
        </button>
        <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center space-y-1 text-zinc-500" data-tab="profile">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-semibold">Profile</span>
        </button>
    </nav>

    <script>
      const remoteJsonUrl = "https://raw.githubusercontent.com/Sajjad-C26/noxify-hub/refs/heads/main/matches.json";
  

        let sportsData = {
            categories: [
                { id: 'all', name: 'All', icon: 'fa-fire' },
                { id: 'cricket', name: 'Cricket', icon: 'fa-baseball-bat-ball' },
                { id: 'football', name: 'Football', icon: 'fa-futbol' },
                { id: 'basketball', name: 'Basketball', icon: 'fa-basketball' }
            ],
            liveMatches: [],
            scheduleMatches: [],
            replays: [
                { title: 'Top 10 Bicycles Kicks of the Decade', duration: '6:45 mins • 60FPS HDR' },
                { title: 'Champions League Epic Comebacks 2025/26', duration: '12:30 mins • 4K UHD' }
            ]
        };

        let currentTab = 'home';
        let selectedCategory = 'all';
        let favorites = JSON.parse(localStorage.getItem('noxify_favs')) || [1];
        let hlsPlayer = null;

        // Fetch Data from Remote JSON Automatically
async function fetchSportsData() {
    try {
        let response = await fetch(remoteJsonUrl);
        let data = await response.json();
        
        sportsData.liveChannels = data.liveChannels || [];
        sportsData.liveMatches = data.liveMatches || [];
        sportsData.scheduleMatches = data.scheduleMatches || [];
        sportsData.replays = data.replays || [];
        
        renderContent();
    } catch (error) {
        console.error("Error fetching live data:", error);
        document.getElementById('mainContent').innerHTML = `
            <div class="text-center py-20 text-red-500 text-xs">
                <i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i>
                <p>Failed to sync live data. Please check connection.</p>
            </div>
        `;
    }
}


        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tab) {
                    btn.classList.remove('text-zinc-500');
                    btn.classList.add('text-red-500');
                } else {
                    btn.classList.remove('text-red-500');
                    btn.classList.add('text-zinc-500');
                }
            });
            renderContent();
        }

        function filterCategory(catId) {
            selectedCategory = catId;
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('mainContent');
            container.innerHTML = '';

            if (currentTab === 'home' || currentTab === 'live') {
                if (sportsData.liveMatches.length > 0) {
                                        // Live TV Channels Hub Integration
                    let channels = sportsData.liveChannels || [];
                    let channelsHtml = `
                        <div class="toffee-channels-container" style="width: 100%; margin: 0 0 16px 0;">
                            <div style="color: #ffffff; font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">🔥 Live TV Channels</div>
                            <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
                    `;
                    channels.forEach(ch => {
                        channelsHtml += `
                            <div onclick="openStream('${ch.streamUrl}', '${ch.name}')" style="display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 2px; cursor: pointer;">
                                <div style="width: 40px; height: 40px; border-radius: 50%; background: #151515; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.15);">
                                    <img src="${ch.logo}" style="width: 75%; height: 75%; object-fit: contain;" onerror="this.src='https://i.imgur.com/dVRMHM4.png'">
                                </div>
                                <span style="color: #cccccc; font-size: 9px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;">${ch.name}</span>
                            </div>
                        `;
                    });
                    channelsHtml += `</div></div>`;
                    container.innerHTML += channelsHtml;

                }

                let catHtml = `<div class="flex space-x-2 overflow-x-auto custom-scrollbar py-2">`;
                sportsData.categories.forEach(cat => {
                    let activeClass = selectedCategory === cat.id ? 'bg-red-600 text-white' : 'bg-[#121214] text-zinc-400 border border-white/5';
                    catHtml += `<button onclick="filterCategory('${cat.id}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center space-x-2 ${activeClass} transition">
                        <i class="fa-solid ${cat.icon}"></i>
                        <span>${cat.name}</span>
                    </button>`;
                });
                catHtml += `</div>`;
                container.innerHTML += catHtml;

                container.innerHTML += `<h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mt-2">Live Broadcast Matrix</h2>`;

                let matchesToDisplay = sportsData.liveMatches.filter(m => selectedCategory === 'all' || m.category === selectedCategory);
                if (matchesToDisplay.length === 0) {
                    container.innerHTML += `<p class="text-xs text-zinc-500 text-center py-6">No live matches in this category right now.</p>`;
                }
                matchesToDisplay.forEach(match => {
                    container.innerHTML += `
                        <div class="bg-[#121214] rounded-xl p-4 glow-border flex flex-col space-y-3">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle text-[6px] mr-1"></i> ${match.status}</span>
                                <button onclick="toggleFav(${match.id})" class="text-zinc-400 hover:text-red-500"><i class="fa-solid fa-heart ${favorites.includes(match.id) ? 'text-red-500' : ''}"></i></button>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-2">
                                    <span class="text-lg">${match.logo1}</span>
                                    <span class="font-bold text-sm">${match.team1}</span>
                                </div>
                                <span class="text-xs font-bold text-zinc-500">${match.score1 || 'VS'} ${match.score2 ? '- ' + match.score2 : ''}</span>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-sm">${match.team2}</span>
                                    <span class="text-lg">${match.logo2}</span>
                                </div>
                            </div>
                            <button onclick="openStream('${match.streamUrl}', '${match.title}')" class="w-full bg-zinc-900 hover:bg-red-600/20 text-red-500 font-semibold py-2.5 rounded-lg text-xs border border-red-600/30 transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-play text-[10px]"></i>
                                <span>Watch HD Stream</span>
                            </button>
                        </div>
                    `;
                });
            } 
            else if (currentTab === 'schedule') {
                container.innerHTML += `<h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Upcoming Match Schedule & Time</h2>`;
                if(sportsData.scheduleMatches.length === 0) {
                    container.innerHTML += `<p class="text-xs text-zinc-500 text-center py-6">No upcoming matches listed.</p>`;
                }
                sportsData.scheduleMatches.forEach(match => {
                    container.innerHTML += `
                        <div class="bg-[#121214] rounded-xl p-4 glow-border space-y-3">
                            <div class="flex justify-between items-center text-xs text-amber-400 font-semibold">
                                <span>${match.title} • ${match.time}</span>
                                <span class="text-[10px] bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded text-amber-300">${match.date}</span>
                            </div>
                            <div class="flex justify-between items-center py-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-lg">${match.logo1}</span>
                                    <span class="font-bold text-sm">${match.team1}</span>
                                </div>
                                <span class="text-xs font-bold text-zinc-500">VS</span>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-sm">${match.team2}</span>
                                    <span class="text-lg">${match.logo2}</span>
                                </div>
                            </div>
                            <button onclick="alert('Reminder set successfully!')" class="w-full bg-zinc-900 text-amber-400 hover:bg-amber-500/10 font-semibold py-2 rounded-lg text-xs border border-amber-500/30 transition flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-bell"></i>
                                <span>Remind Me</span>
                            </button>
                        </div>
                    `;
                });
            }
            else if (currentTab === 'favorites') {
                container.innerHTML += `<h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Persistent Saved Favorites</h2>`;
                let favMatches = sportsData.liveMatches.filter(m => favorites.includes(m.id));
                if (favMatches.length === 0) {
                    container.innerHTML += `<p class="text-xs text-zinc-500 text-center py-6">No saved favorite live matches right now.</p>`;
                }
                favMatches.forEach(match => {
                    container.innerHTML += `
                        <div class="bg-[#121214] rounded-xl p-4 glow-border flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm">${match.title}</p>
                                <span class="text-[10px] text-emerald-400"><i class="fa-solid fa-circle text-[6px] mr-1"></i> ${match.status}</span>
                            </div>
                            <button onclick="toggleFav(${match.id})" class="bg-zinc-900 hover:bg-red-600/20 text-red-500 px-3 py-1.5 rounded-lg text-xs border border-red-500/30 transition">Remove</button>
                        </div>
                    `;
                });
            }
            else if (currentTab === 'replays') {
                container.innerHTML += `<h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Cinematic Replay Hub</h2>`;
                sportsData.replays.forEach(replay => {
                    container.innerHTML += `
                        <div class="bg-[#121214] rounded-xl overflow-hidden glow-border p-4 flex flex-col space-y-2">
                            <h4 class="font-bold text-sm">${replay.title}</h4>
                            <p class="text-[11px] text-zinc-500">${replay.duration}</p>
                        </div>
                    `;
                });
            }
            else if (currentTab === 'profile') {
                container.innerHTML += `
                    <div class="bg-[#121214] rounded-2xl p-5 glow-border text-center space-y-4">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-red-600 to-purple-600 mx-auto flex items-center justify-center font-bold text-xl text-white shadow-xl">S</div>
                        <div>
                            <h3 class="font-bold text-base">Sajjad Hossain</h3>
                            <p class="text-xs text-amber-400 font-semibold mt-0.5"><i class="fa-solid fa-crown mr-1"></i> VIP ELITE MEMBER</p>
                            <p class="text-[11px] text-zinc-500 italic mt-1">"Passionate Football & Sports Fan 🚀"</p>
                        </div>
                        <div class="pt-2 border-t border-white/5 flex justify-around text-xs">
                            <div>
                                <p class="text-zinc-500">Saved Favs</p>
                                <p class="font-bold text-white text-sm">${favorites.length} Matches</p>
                            </div>
                            <div>
                                <p class="text-zinc-500">Cloud Sync</p>
                                <p class="font-bold text-emerald-400 text-sm">Active</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function toggleFav(id) {
            if(favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('noxify_favs', JSON.stringify(favorites));
            renderContent();
        }

        function openStream(url, title) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('streamModal').classList.remove('hidden');
            
            const video = document.getElementById('videoPlayer');
            
            if (Hls.isSupported()) {
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                }
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        }

        function closeStream() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.src = '';
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
            document.getElementById('streamModal').classList.add('hidden');
        }

        // Initialize App by Fetching Remote JSON Data
        fetchSportsData();
    </script>
    <script src="channels-ui.js"></script>

</body>
</html>
