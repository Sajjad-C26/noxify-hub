<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noxify - Royal Cinematic & Sports Hub</title>
    
    <!-- PWA & Icon Links -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="https://sajjad-c26.github.io/noxify-hub/icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .royal-card {
            background: linear-gradient(135deg, rgba(25, 25, 32, 0.9) 0%, rgba(12, 12, 16, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .royal-nav {
            background: rgba(10, 10, 13, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .hero-banner {
            background: radial-gradient(circle at top right, rgba(229, 9, 20, 0.15), transparent 50%),
                        linear-gradient(135deg, #0a0a0d 0%, #101014 100%);
        }
    </style>
</head>
<body class="bg-[#0a0a0d] text-white min-h-screen font-sans selection:bg-red-600 selection:text-white pb-24">

    <!-- Header Section -->
    <header class="sticky top-0 z-50 bg-[#0a0a0d]/80 backdrop-blur-md border-b border-white/10 px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-black tracking-wider text-red-600">NOXIFY</h1>
        <span class="text-xs text-gray-400 bg-white/5 px-2 py-1 rounded-full">Hub</span>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 mt-4">
        <div class="hero-banner royal-card rounded-2xl p-6 md:p-8 text-center">
            <h2 class="text-2xl md:text-4xl font-extrabold mb-3">Royal Cinematic & Sports Hub</h2>
            <p class="text-gray-400 text-sm md:text-base max-w-xl mx-auto mb-6">
                Your ultimate destination for streaming cinematic content and sports updates seamlessly.
            </p>
            <div class="inline-block bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-300 shadow-lg shadow-red-600/30 cursor-pointer">
                Explore Hub
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="royal-nav fixed bottom-0 left-0 right-0 z-50 px-6 py-3 flex justify-around items-center max-w-lg mx-auto md:rounded-t-2xl">
        <a href="./index.html" class="flex flex-col items-center text-red-500 text-xs font-medium">
            <span>🏠</span>
            <span class="mt-1">Home</span>
        </a>
    </nav>

</body>
</html>
